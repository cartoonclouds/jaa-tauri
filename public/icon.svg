<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D8CFF"/>
      <stop offset="0.55" stop-color="#4338F5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="doc" x1="312" y1="156" x2="744" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>

    <linearGradient id="accent" x1="368" y1="320" x2="620" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#1E1B4B" flood-opacity="0.28"/>
    </filter>

    <filter id="buttonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="64" y="64" width="896" height="896" rx="190" fill="url(#bg)"/>

  <!-- Main document -->
  <g filter="url(#softShadow)">
    <path d="M284 168C284 145.9 301.9 128 324 128H664L780 244V776C780 798.1 762.1 816 740 816H324C301.9 816 284 798.1 284 776V168Z" fill="url(#doc)"/>

    <!-- Folded corner -->
    <path d="M664 128V236C664 258.1 681.9 276 704 276H780L664 128Z" fill="#C4B5FD"/>
    <path d="M664 128V236C664 258.1 681.9 276 704 276H780L664 128Z" fill="white" opacity="0.18"/>
  </g>

  <!-- Profile avatar -->
  <circle cx="460" cy="336" r="78" fill="#E0E7FF"/>
  <circle cx="460" cy="302" r="38" fill="url(#accent)"/>
  <path d="M388 404C401.8 361.2 429.6 340 460 340C490.4 340 518.2 361.2 532 404C510.6 422.8 485.7 432 460 432C434.3 432 409.4 422.8 388 404Z" fill="url(#accent)"/>

  <!-- Text lines -->
  <rect x="372" y="544" width="360" height="34" rx="17" fill="url(#accent)" opacity="0.82"/>
  <rect x="372" y="648" width="260" height="34" rx="17" fill="url(#accent)" opacity="0.76"/>

  <!-- Search badge -->
  <g filter="url(#buttonShadow)">
    <circle cx="708" cy="712" r="126" fill="#4F46E5"/>
    <circle cx="708" cy="712" r="126" fill="url(#accent)" opacity="0.65"/>
    <circle cx="708" cy="712" r="126" stroke="#A5B4FC" stroke-opacity="0.45" stroke-width="4"/>
  </g>

  <!-- Magnifying glass -->
  <circle cx="684" cy="686" r="48" stroke="white" stroke-width="28"/>
  <path d="M720 722L774 776" stroke="white" stroke-width="28" stroke-linecap="round"/>
</svg>
