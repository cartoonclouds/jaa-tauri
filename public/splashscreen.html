<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyFlow</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, #141c30, #244080);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .logo {
        width: 180px;
        height: 180px;
      }

      .title {
        font-size: 2rem;
        font-weight: bold;
        color: #ffffff;
        letter-spacing: 0.05em;
      }

      .tagline {
        font-size: 0.95rem;
        color: #dce4f0;
        margin-top: -24px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(64, 196, 255, 0.25);
        border-top-color: #40c4ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1024 1024"
      >
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#141C30" />
            <stop offset="100%" stop-color="#244080" />
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" fill="url(#bg)" rx="200" />
        <circle cx="512" cy="480" r="170" fill="#40C4FF" />
        <circle
          cx="512"
          cy="480"
          r="95"
          fill="none"
          stroke="white"
          stroke-width="20"
        />
        <line
          x1="590"
          y1="558"
          x2="710"
          y2="678"
          stroke="white"
          stroke-width="20"
        />
      </svg>
      <p class="title">ApplyFlow</p>
      <p class="tagline">Track every application with confidence</p>
      <div class="spinner"></div>
    </div>
  </body>
</html>
